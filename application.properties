spring.application.name=truthscan

# ---------- Server ----------
# Hosting platforms (Render, Railway, Heroku) pass the port in $PORT
server.port=${PORT:8080}
server.compression.enabled=true
server.error.include-message=always

# ---------- Database (PostgreSQL) ----------
# Either set DATABASE_URL (JDBC format) or DB_HOST/DB_PORT/DB_NAME
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:truthscan}}
spring.datasource.username=${DB_USER:truthscan}
spring.datasource.password=${DB_PASSWORD:truthscan}
spring.datasource.hikari.maximum-pool-size=5

# Tables are created by Flyway (src/main/resources/db/migration), not Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# ---------- Health check for the hosting platform ----------
management.endpoints.web.exposure.include=health

# ---------- App settings ----------
# Secret for /api/admin/** (the admin review page). Empty = admin disabled.
app.admin-key=${ADMIN_KEY:}

# Open Food Facts product database
app.off.base-url=https://world.openfoodfacts.org/api/v2
app.off.user-agent=TruthScan/0.1 (${OFF_CONTACT_EMAIL:contact@example.com})
app.off.timeout-ms=6000
