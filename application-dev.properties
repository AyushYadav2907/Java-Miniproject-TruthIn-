# Local development without installing PostgreSQL:
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Uses an in-memory H2 database (data is lost when the app stops).
spring.datasource.url=jdbc:h2:mem:truthscan;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Browse the database at http://localhost:8080/h2-console (JDBC URL above)
spring.h2.console.enabled=true

app.admin-key=dev-admin-key
